name: Render Video

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render:
    name: Render Remotion Video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Render Video
        run: |
          mkdir -p out
          npx remotion render MainComposition out/overgeared_new_short.mp4 --gl=angle

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overgeared-new-short-video
          path: out/overgeared_new_short.mp4
          retention-days: 14
